name: Fetch product photos
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-products.yml", "scripts/fetch_products.py"]
  schedule:
    - cron: "17 9 * * 1"   # weekly, Monday
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/fetch_products.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add media/products
          git diff --cached --quiet || git commit -m "Update product photos from quiickmedicine.ca"
          git pull --rebase && git push
